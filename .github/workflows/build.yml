---
name: Build
on: [push, pull_request]
permissions: read-all

jobs:
  pre-commit:
    name: Pre-commit (linting)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # Fleet standard is Python 3.13.
        python-version: ["3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Deliberately NOT installing hermes-agent: these tests must pass from a
        # bare clone, which is what a new contributor actually has. The plugin
        # falls back to hermes_compat stubs when the runtime is absent.
        run: python -m pip install --upgrade pip pytest pyyaml

      - name: Run tests
        run: python -m pytest -q

      - name: Check the generated skills manifest is current
        # skills/MANIFEST.yaml is what an installing agent reads instead of nineteen
        # SKILL.md files. A stale manifest is worse than none, so regenerate and diff.
        run: python scripts/generate_manifest.py --check

      - name: Run skill self-checks
        # Some skills ship executable helpers with their own verification suites.
        # Run them here so a shipped script can't silently rot.
        run: python skills/project-steward/scripts/verify_board.py

  node-test:
    name: Tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: devops/app-router/auth-service/package-lock.json

      - name: Install auth-service dependencies
        # Lifecycle scripts are the npm supply-chain attack surface. The Aug 2026
        # keyv worm shipped as a "preinstall" hook and published with valid
        # GitHub-signed provenance, so a pinned lockfile is not the guarantee it
        # looks like. These three deps are pure JavaScript with no build step, so
        # nothing legitimate needs scripts to run here. Do not drop this flag.
        run: npm ci --ignore-scripts
        working-directory: devops/app-router/auth-service

      - name: Run auth-service tests
        run: npm test
        working-directory: devops/app-router/auth-service

      - name: Run shared-browser tests
        # No dependencies: these model browserd's bookkeeping directly so they
        # run without Playwright or a real Chrome.
        run: node --test browserd.test.mjs
        working-directory: devops/shared-browser
